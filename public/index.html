<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shrimad Rajchandra Vachnamrutji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&family=Noto+Sans+Gujarati:wght@300;400&family=Noto+Serif+Gujarati:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fff;--panel:#f7f5f0;--ink:#1c1e3a;--mute:#6b6e8a;--gold:#a6853c;--line:rgba(166,133,60,.3)}
*{box-sizing:border-box;margin:0}
body{background:#fff;color:var(--ink);font:300 16px/1.7 Jost,'Noto Sans Gujarati',sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Cormorant Garamond','Noto Serif Gujarati',serif;font-weight:300;letter-spacing:.02em}
button,input,select{font:inherit;color:inherit}
select{background:var(--panel);border:0;border-bottom:1px solid var(--line);padding:10px 2px}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.hidden{display:none!important}
body.boot .wrap{visibility:hidden}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 0;border-bottom:1px solid var(--line)}
.brand{font:300 1.5rem 'Cormorant Garamond','Noto Serif Gujarati',serif;letter-spacing:.08em}
nav{display:flex;gap:22px;color:var(--mute);font-size:.9rem}
.link{background:none;border:0;cursor:pointer;color:var(--mute);border-bottom:1px solid transparent;padding:0}
.link:hover,.link[aria-current=true]{color:var(--gold);border-color:var(--gold)}
#auth{min-height:80vh;display:grid;place-items:center;text-align:center}
#auth h1{font-size:clamp(2.6rem,7vw,4.8rem);line-height:1.1;margin-bottom:12px}
.sub{color:var(--mute);max-width:36ch;margin:0 auto 40px;font:italic 1.3rem 'Cormorant Garamond','Noto Serif Gujarati',serif}
form{display:grid;gap:18px;max-width:320px;margin:0 auto;text-align:left}
input[type=email],input[type=password],input[type=text]{background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;width:100%}
input::placeholder{color:#6d7091}
.btn{background:none;border:1px solid var(--gold);color:var(--gold);padding:12px 28px;cursor:pointer;letter-spacing:.12em;transition:.3s}
.btn:hover{background:var(--gold);color:var(--bg)}
.msg{min-height:1.5em;font-size:.9rem;color:var(--gold)}
#lib{display:grid;grid-template-columns:300px 1fr;gap:64px;padding:56px 0 120px}
body.hasbar #lib{padding-bottom:150px}
#toc h2{font-size:1.9rem;margin-bottom:24px}
#toc ol{list-style:none;padding:0}
#toc li button{display:block;width:100%;text-align:left;background:none;border:0;border-left:1px solid var(--line);padding:12px 18px;color:var(--mute);cursor:pointer;font:1.2rem 'Cormorant Garamond','Noto Serif Gujarati',serif;transition:.3s}
#toc li button:hover{color:var(--ink)}
#toc li button[aria-current=true]{border-left-color:var(--gold);color:var(--ink);padding-left:26px}
#reader h2{font-size:clamp(2rem,4vw,3rem);margin-bottom:24px}
audio{width:100%;height:40px}
.pages,.stage{display:grid;gap:36px}
.stage{gap:10px}
.pages img,.stage img{width:100%;border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(28,30,58,.35);background:var(--panel);min-height:200px}
.pgno{color:var(--mute);font-size:.85rem;text-align:center}
.empty{color:var(--mute);font:italic 1.3rem 'Cormorant Garamond','Noto Serif Gujarati',serif}
/* bottom audio player */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 24px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px -20px rgba(28,30,58,.35)}
#bar .in{max-width:1100px;margin:0 auto;display:flex;gap:16px;align-items:center}
#bar .nowp{font:1.15rem 'Cormorant Garamond','Noto Serif Gujarati',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30%}
#bar audio{flex:1;min-width:0}
@media(max-width:600px){#bar .nowp{display:none}}
#admin{padding:48px 0 120px}
#admin h2{font-size:2.2rem;margin-bottom:8px}
.bar{height:2px;background:var(--line);margin:14px 0 36px;max-width:420px}.bar i{display:block;height:100%;background:var(--gold)}
.tabs{display:flex;gap:28px;margin-bottom:36px;border-bottom:1px solid var(--line);padding-bottom:12px}
.pane{max-width:640px}.pane.wide{max-width:none}
label{display:grid;gap:6px;color:var(--mute);font-size:.9rem}
.drop{border:1px dashed var(--line);padding:22px;text-align:center;color:var(--mute);cursor:pointer;transition:.3s}
.drop.over,.drop:hover{border-color:var(--gold);color:var(--ink)}
.row{display:grid;grid-template-columns:60px 1fr 1fr 150px auto auto auto auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;color:var(--mute);font-weight:300;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
td{padding:12px 10px 12px 0;border-bottom:1px solid var(--line)}
.tag{color:var(--gold)}
.tw{overflow-x:auto}
/* admin: page timings editor */
#timing{border:1px solid var(--line);padding:22px;margin-bottom:36px;background:var(--panel);display:grid;gap:14px}
#timing h3{font-size:1.6rem}
#timing .note{color:var(--mute);font-size:.9rem}
.trow{display:grid;grid-template-columns:70px 70px 110px auto auto;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.trow img{width:60px;height:80px;object-fit:cover;border:1px solid var(--line)}
.trow input{border:1px solid var(--line);padding:6px 8px;background:#fff}
@media(max-width:800px){#lib{grid-template-columns:1fr;gap:32px;padding-top:32px}.trow{grid-template-columns:60px 1fr;}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
body.home{background:linear-gradient(rgba(18,20,43,.6),rgba(18,20,43,.9)),url(Cover.jpg) center/cover fixed no-repeat}
body.home header{border-color:transparent}
body.home #auth{align-items:end;min-height:calc(100vh - 100px);padding-bottom:22vh}
body.home #bookTitle,body.home #bookTag,body.home .brand{display:none}
#authForm{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;align-items:end;padding:14px 18px 10px;max-width:580px;width:100%;background:rgba(255,255,255,.07);color:#fff;border-radius:8px;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);box-shadow:0 16px 40px -20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25)}
#authForm #nm,#authForm .btn,#authForm .link,#authForm .msg{grid-column:1/-1}
@media(max-width:600px){#authForm{grid-template-columns:1fr}}
#authForm input{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:8px 12px;font-size:.95rem}
#authForm input::placeholder{color:rgba(255,255,255,.75)}
#authForm input:focus{outline:0;border-color:#fff;background:rgba(255,255,255,.25)}
#authForm .btn{background:rgba(255,255,255,.88);color:#1c1e3a;border:0;border-radius:6px;padding:8px 24px;letter-spacing:.1em}
#authForm .btn:hover{background:#c2a566;color:#1c1e3a}
#authForm .link{color:rgba(255,255,255,.85);text-align:center;font-size:.85rem}
#authForm .link:hover{color:#fff;border-color:#fff}
#authForm .msg{color:#f3e2b3;text-align:center;font-size:.82rem;min-height:0;line-height:1.3}
#toc li button{padding-left:calc(18px + (var(--d,1) - 1)*20px)}
#toc li button[aria-current=true]{padding-left:calc(26px + (var(--d,1) - 1)*20px)}
#toc li button[data-d="2"]{font-size:1.05rem}#toc li button[data-d="3"]{font-size:.95rem}
header .right{display:flex;gap:22px;align-items:center;margin-left:auto}
</style>
</head>
<body class="boot">
<div class="wrap">
<header>
  <div class="brand" id="brand"></div>
  <div class="right">
    <nav id="nav" class="hidden">
      <button class="link" id="goLib" data-i="library">Library</button>
      <button class="link hidden" id="goAdmin" data-i="admin">Admin</button>
      <button class="link" id="out" data-i="out">Sign out</button>
    </nav>
  </div>
</header>

<section id="auth">
  <div>
    <h1 id="bookTitle"></h1>
    <p class="sub" id="bookTag"></p>
    <form id="authForm">
      <input type="text" id="nm" placeholder="Your name" data-p="name" class="hidden" autocomplete="name">
      <input type="email" id="em" placeholder="Email" data-p="email" required autocomplete="email">
      <input type="password" id="pw" placeholder="Password (6+ characters)" data-p="pass" required minlength="6" autocomplete="current-password">
      <button class="btn" id="authBtn">Sign in</button>
      <button type="button" class="link" id="toggle">New here? Create an account</button>
      <div class="msg" id="authMsg" role="status"></div>
    </form>
  </div>
</section>

<section id="lib" class="hidden">
  <aside id="toc"><h2 data-i="contents">Contents</h2><ol id="chapters"></ol></aside>
  <main id="reader"><p class="empty" data-i="choose">Choose a chapter to begin.</p></main>
</section>

<section id="admin" class="hidden">
  <h2>Administration</h2>
  <div id="stats" class="empty"></div>
  <div class="bar"><i id="barfill" style="width:0"></i></div>
  <div class="tabs" id="tabs">
    <button class="link" data-t="up">Upload</button>
    <button class="link" data-t="ch">Chapters</button>
    <button class="link" data-t="mem">Members</button>
  </div>

  <div class="pane" id="p-up">
    <form id="upForm" style="max-width:none">
      <label>Add to<select id="target"></select></label>
      <label id="titleL">Chapter title (English)<input type="text" id="cTitle"></label>
      <label id="guL">Chapter title (Gujarati)<input type="text" id="cTitleGu"></label>
      <label id="parentL">Place under<select id="parent"></select></label>
      <label id="posL">Position among siblings (blank = at the end)<input type="text" id="cPos" inputmode="numeric"></label>
      <div class="drop" id="dropA" tabindex="0">Drop an audio file here, or click to choose<br><small id="aName"></small></div>
      <div class="drop" id="dropI" tabindex="0">Drop page images here, or click to choose<br><small id="iName"></small></div>
      <input type="file" id="fA" accept="audio/*" class="hidden">
      <input type="file" id="fI" accept="image/*" multiple class="hidden">
      <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="cmp" checked>Shrink images before upload (saves storage)</label>
      <button class="btn">Upload</button>
      <div class="bar" style="max-width:none;margin:0"><i id="upbar" style="width:0"></i></div>
      <div class="msg" id="upMsg" role="status"></div>
    </form>
  </div>
  <div class="pane wide hidden" id="p-ch"><div id="timing" class="hidden"></div><div id="rows"></div></div>
  <div class="pane wide hidden" id="p-mem"><div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Last seen</th><th>Access</th><th>Role</th></tr></thead><tbody id="mrows"></tbody></table></div></div>
</div>
</section>
</div>

<!-- bottom audio player -->
<div id="bar" class="hidden"></div>

<script>
/* ====== EDIT THESE ====== */
const SUPABASE_URL = 'https://lpowlcdawtpdttmahxaw.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxwb3dsY2Rhd3RwZHR0bWFoeGF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzgyOTAsImV4cCI6MjEwNjIxNDI5MH0.E5zXL0RL9cljYUBEslPXKxyuU5buKbC30pxWNltTiUs';
const BOOK = { title: 'Shrimad Rajchandra Vachnamrutji', tagline: 'જેણે આત્મા જાણ્યો તેણે સર્વ જાણ્યું.' };
const QUOTA_MB = 1024; /* Supabase free storage */
/* ======================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const h = (t, p = {}, ...k) => { const e = Object.assign(document.createElement(t), p); e.append(...k); return e; };
const B = 'book', safe = n => n.replace(/[^a-zA-Z0-9._-]/g, '_');
const fmt = d => d ? new Date(d).toLocaleDateString() : '-';
let signup = false, me = {}, chapters = [], current = null, audioFile = null, imgFiles = [];

$('brand').textContent = $('bookTitle').textContent = document.title = BOOK.title;
$('bookTag').textContent = BOOK.tagline;

/* Interface text is English only. Only chapter titles (the index) are Gujarati. */
const T = {
  library: 'Library', admin: 'Admin', out: 'Sign out', contents: 'Contents', choose: 'Choose a chapter to begin.',
  name: 'Your name', email: 'Email', pass: 'Password (6+ characters)', signin: 'Sign in', create: 'Create account',
  'new': 'New here? Create an account', have: 'Already registered? Sign in',
  check: 'Check your email to confirm, then sign in.', paused: 'Your access is paused. Please contact the administrator.',
  empty: 'Chapters will appear here.', pickSub: 'Choose a sub-section from the contents.'
};
const t = k => T[k];
function applyLang() {
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e => e.placeholder = t(e.dataset.p));
  $('authBtn').textContent = t(signup ? 'create' : 'signin');
  $('toggle').textContent = t(signup ? 'have' : 'new');
}
applyLang();
const show = v => {
  document.body.classList.remove('boot');
  if (v !== 'lib') stopBar();
  document.body.classList.toggle('home', v === 'auth');
  ['auth', 'lib', 'admin'].forEach(s => $(s).classList.toggle('hidden', s !== v));
};

/* safety net: if the sign-in check never answers, show the sign-in page */
setTimeout(() => { if (document.body.classList.contains('boot')) show('auth'); }, 5000);

/* ---------- auth ---------- */
$('toggle').onclick = () => {
  signup = !signup;
  $('nm').classList.toggle('hidden', !signup);
  applyLang();
  $('authMsg').textContent = '';
};
$('authForm').onsubmit = async e => {
  e.preventDefault();
  const c = { email: $('em').value, password: $('pw').value };
  if (signup) c.options = { data: { full_name: $('nm').value }, emailRedirectTo: window.location.origin };
  const { data, error } = signup ? await sb.auth.signUp(c) : await sb.auth.signInWithPassword(c);
  if (error) return $('authMsg').textContent = error.message;
  if (signup && !data.session) $('authMsg').textContent = t('check');
};
$('out').onclick = () => sb.auth.signOut();
$('goLib').onclick = () => { show('lib'); loadChapters(); };
$('goAdmin').onclick = () => { show('admin'); tab('up'); loadChapters(); loadStats(); };

sb.auth.onAuthStateChange(async (_e, s) => {
  $('nav').classList.toggle('hidden', !s);
  if (!s) { me = {}; return show('auth'); }
  setTimeout(async () => {
    sb.rpc('touch_me');
    const { data } = await sb.from('profiles').select('*').eq('id', s.user.id).single();
    me = data || {};
    $('goAdmin').classList.toggle('hidden', !me.is_admin);
    show('lib');
    if (!me.approved && !me.is_admin) $('reader').replaceChildren(h('p', { className: 'empty', textContent: t('paused') }));
    else loadChapters();
  });
});

/* ---------- reader ---------- */
const kids = id => chapters.filter(c => c.parent_id === id).sort((a, b) => a.position - b.position);
const flat = (pid = null, d = 1) => kids(pid).flatMap(c => [{ c, d }, ...flat(c.id, d + 1)]);
const desc = c => kids(c.id).flatMap(k => [k, ...desc(k)]);
const heightOf = c => 1 + Math.max(0, ...kids(c.id).map(heightOf));
const pad = d => '\u00A0\u00A0'.repeat(d - 1);
const expanded = new Set();
/* Chapter titles always show in Gujarati, falling back to English if none entered */
const ttl = c => c.title_gu || c.title;

/* time helpers: "1:25" <-> seconds */
const parseT = s => {
  s = String(s).trim(); if (!s) return null;
  const p = s.split(':').map(Number);
  if (p.length > 3 || p.some(x => Number.isNaN(x) || x < 0)) return NaN;
  return p.reduce((a, x) => a * 60 + x, 0);
};
const fmtT = s => {
  if (s == null) return '';
  s = Math.floor(s);
  const hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  return (hh ? hh + ':' + String(mm).padStart(2, '0') : mm) + ':' + String(ss).padStart(2, '0');
};

function stopBar() {
  const bar = $('bar'), au = bar.querySelector('audio');
  if (au) au.pause();
  bar.replaceChildren(); bar.classList.add('hidden');
  document.body.classList.remove('hasbar');
}

async function loadChapters() {
  const { data } = await sb.from('chapters').select('*').order('position');
  chapters = data || [];
  renderToc();
  if (me.is_admin) { renderTarget(); renderRows(); }
}
function renderToc() {
  const ol = $('chapters'); ol.replaceChildren();
  const walk = (pid, d) => kids(pid).forEach(ch => {
    const k = kids(ch.id);
    const b = h('button', { textContent: (k.length ? (expanded.has(ch.id) ? '\u25BE ' : '\u25B8 ') : '') + ttl(ch), onclick: () => {
      if (k.length) expanded.has(ch.id) ? expanded.delete(ch.id) : expanded.add(ch.id);
      openChapter(ch); renderToc();
    } });
    b.dataset.id = ch.id; b.dataset.d = d; b.style.setProperty('--d', d); b.setAttribute('aria-current', current === ch.id);
    ol.append(h('li', {}, b));
    if (expanded.has(ch.id)) walk(ch.id, d + 1);
  });
  walk(null, 1);
  if (!chapters.length) ol.append(h('li', { className: 'empty', textContent: t('empty') }));
}

async function openChapter(ch) {
  current = ch.id;
  document.querySelectorAll('#chapters button').forEach(b => b.setAttribute('aria-current', b.dataset.id == ch.id));
  const [{ data: a }, { data: pgs }] = await Promise.all([
    ch.audio_path ? sb.storage.from(B).createSignedUrl(ch.audio_path, 7200) : Promise.resolve({ data: null }),
    sb.from('pages').select('*').eq('chapter_id', ch.id).order('position')
  ]);
  if (current !== ch.id) return; /* user already clicked another chapter */
  const list = pgs || [];
  let urls = [];
  if (list.length) {
    const { data: u } = await sb.storage.from(B).createSignedUrls(list.map(p => p.image_path), 7200);
    urls = (u || []).map(x => x.signedUrl);
  }
  if (current !== ch.id) return;

  stopBar();
  const parts = [h('h2', { textContent: ttl(ch) })];
  /* timed mode: audio exists and the admin has set at least one page time */
  const timed = !!a && list.some(p => p.start_time != null);

  if (a) {
    const au = h('audio', { controls: true, preload: 'metadata', src: a.signedUrl });
    $('bar').append(h('div', { className: 'in' }, h('span', { className: 'nowp', textContent: ttl(ch) }), au));
    $('bar').classList.remove('hidden');
    document.body.classList.add('hasbar');

    if (timed) {
      const starts = list.map((p, i) => p.start_time != null ? Number(p.start_time) : (i === 0 ? 0 : Infinity));
      const img = h('img'), no = h('div', { className: 'pgno' });
      parts.push(h('div', { className: 'stage' }, img, no));
      let shown = -1;
      const sync = () => {
        const now = au.currentTime; let idx = 0;
        starts.forEach((s, i) => { if (s <= now) idx = i; });
        if (idx === shown) return;
        const first = shown === -1; shown = idx;
        img.src = urls[idx] || ''; img.alt = `${ttl(ch)}, page ${idx + 1}`;
        no.textContent = `${idx + 1} / ${list.length}`;
        if (urls[idx + 1]) new Image().src = urls[idx + 1]; /* preload next page */
        if (!first) window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      ['timeupdate', 'seeked', 'loadedmetadata'].forEach(ev => au.addEventListener(ev, sync));
      sync();
    }
  }

  if (!timed && list.length) {
    const box = h('div', { className: 'pages' });
    urls.forEach((src, i) => box.append(h('img', { alt: `${ttl(ch)}, page ${i + 1}`, loading: 'lazy', src })));
    parts.push(box);
  }
  if (!a && !list.length) parts.push(h('p', { className: 'empty', textContent: t('pickSub') }));
  $('reader').replaceChildren(...parts);
  window.scrollTo({ top: 0 });
}

/* ---------- admin: tabs & stats ---------- */
function tab(t) {
  ['up', 'ch', 'mem'].forEach(x => $('p-' + x).classList.toggle('hidden', x !== t));
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.t === t));
  if (t === 'mem') loadMembers();
}
$('tabs').onclick = e => e.target.dataset.t && tab(e.target.dataset.t);

async function loadStats() {
  const [{ count: m }, { data: bytes }, { count: p }] = await Promise.all([
    sb.from('profiles').select('*', { count: 'exact', head: true }),
    sb.rpc('storage_used'),
    sb.from('pages').select('*', { count: 'exact', head: true })
  ]);
  const mb = (bytes || 0) / 1048576;
  $('stats').textContent = `${chapters.length} chapters, ${p || 0} pages, ${m || 0} members. ${mb.toFixed(0)} MB of ${QUOTA_MB} MB storage used.`;
  $('barfill').style.width = Math.min(100, mb / QUOTA_MB * 100) + '%';
}

/* ---------- admin: upload ---------- */
function renderTarget() {
  const t = $('target'), p = $('parent'), tv = t.value, pv = p.value;
  t.replaceChildren(h('option', { value: '', textContent: 'A new entry in the index' }),
    ...flat().map(({ c, d }) => h('option', { value: c.id, textContent: pad(d) + 'Add files to: ' + c.title })));
  p.replaceChildren(h('option', { value: '', textContent: 'Top level' }),
    ...flat().filter(x => x.d < 3).map(({ c, d }) => h('option', { value: c.id, textContent: pad(d) + c.title })));
  t.value = tv; p.value = pv; syncTarget();
}
function syncTarget() { const n = !$('target').value; ['titleL', 'guL', 'posL', 'parentL'].forEach(i => $(i).classList.toggle('hidden', !n)); }
$('target').onchange = syncTarget;

function wireDrop(zone, input, onFiles) {
  zone.onclick = () => input.click();
  zone.onkeydown = e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), input.click());
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('over'); };
  zone.ondragleave = () => zone.classList.remove('over');
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('over'); onFiles([...e.dataTransfer.files]); };
  input.onchange = () => onFiles([...input.files]);
}
wireDrop($('dropA'), $('fA'), f => { audioFile = f.find(x => x.type.startsWith('audio/')) || null; $('aName').textContent = audioFile ? audioFile.name : ''; });
wireDrop($('dropI'), $('fI'), f => {
  imgFiles = f.filter(x => x.type.startsWith('image/')).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  $('iName').textContent = imgFiles.length ? imgFiles.length + ' images selected' : '';
});

async function shrink(f) {
  if (!$('cmp').checked) return { blob: f, name: safe(f.name) };
  const bm = await createImageBitmap(f), s = Math.min(1, 1600 / bm.width), c = document.createElement('canvas');
  c.width = Math.round(bm.width * s); c.height = Math.round(bm.height * s);
  c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/webp', .82));
  return blob ? { blob, name: safe(f.name).replace(/\.[^.]+$/, '') + '.webp' } : { blob: f, name: safe(f.name) };
}

$('upForm').onsubmit = async e => {
  e.preventDefault();
  const m = $('upMsg'), tid = $('target').value, total = imgFiles.length + (audioFile ? 1 : 0);
  let done = 0; const tick = () => $('upbar').style.width = (++done / total * 100) + '%';
  try {
    if (!total && tid) throw new Error('Choose an audio file or page images.');
    let ch = chapters.find(c => c.id == tid), folder, up = async (p, f, o) => { const r = await sb.storage.from(B).upload(p, f, o); if (r.error) throw r.error; };
    if (!ch) {
      if (!$('cTitle').value) throw new Error('Please enter a title.');
      const pid = +$('parent').value || null, sib = kids(pid);
      const pos = $('cPos').value ? +$('cPos').value : (sib.length ? Math.max(...sib.map(x => x.position)) + 1 : 1);
      folder = crypto.randomUUID(); let ap = null;
      if (audioFile) { m.textContent = 'Uploading audio...'; ap = `${folder}/audio-${safe(audioFile.name)}`; await up(ap, audioFile); tick(); }
      const r = await sb.from('chapters').insert({ title: $('cTitle').value, position: pos, parent_id: pid, audio_path: ap, title_gu: $('cTitleGu').value || null }).select().single();
      if (r.error) throw r.error; ch = r.data;
    } else {
      folder = ch.audio_path ? ch.audio_path.split('/')[0] : 'node-' + ch.id;
      if (audioFile) {
        m.textContent = 'Replacing audio...';
        const ap = `${folder}/audio-${Date.now()}-${safe(audioFile.name)}`; await up(ap, audioFile);
        await sb.from('chapters').update({ audio_path: ap }).eq('id', ch.id);
        if (ch.audio_path) await sb.storage.from(B).remove([ch.audio_path]); tick();
      }
    }
    const { data: last } = await sb.from('pages').select('position').eq('chapter_id', ch.id).order('position', { ascending: false }).limit(1);
    let n = last && last.length ? last[0].position : 0; const rows = [];
    for (const f of imgFiles) {
      m.textContent = `Uploading page ${rows.length + 1} of ${imgFiles.length}...`;
      const { blob, name } = await shrink(f); n++;
      const p = `${folder}/p${String(n).padStart(3, '0')}-${Date.now()}-${name}`;
      await up(p, blob, { contentType: blob.type }); tick();
      rows.push({ chapter_id: ch.id, position: n, image_path: p });
    }
    if (rows.length) { const r = await sb.from('pages').insert(rows); if (r.error) throw r.error; }
    m.textContent = 'Upload complete.'; e.target.reset(); audioFile = null; imgFiles = [];
    $('aName').textContent = $('iName').textContent = ''; $('upbar').style.width = 0;
    await loadChapters(); loadStats();
  } catch (err) { m.textContent = 'Upload failed: ' + err.message; }
};

/* ---------- admin: page timings ---------- */
async function openTiming(ch) {
  const box = $('timing');
  box.classList.remove('hidden');
  box.replaceChildren(h('p', { className: 'note', textContent: 'Loading...' }));
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  const { data: pgs } = await sb.from('pages').select('*').eq('chapter_id', ch.id).order('position');
  const list = pgs || [];
  const [{ data: a }, { data: u }] = await Promise.all([
    sb.storage.from(B).createSignedUrl(ch.audio_path, 7200),
    list.length ? sb.storage.from(B).createSignedUrls(list.map(p => p.image_path), 7200) : Promise.resolve({ data: [] })
  ]);
  const au = h('audio', { controls: true, preload: 'metadata' }); if (a) au.src = a.signedUrl;
  const msg = h('div', { className: 'msg', role: 'status' });
  const inputs = list.map((p, i) => {
    const inp = h('input', { type: 'text', placeholder: 'm:ss', ariaLabel: `Page ${i + 1} start time`,
      value: p.start_time != null ? fmtT(p.start_time) : (i === 0 ? '0:00' : '') });
    const thumb = h('img', { alt: `Page ${i + 1}`, src: (u && u[i] && u[i].signedUrl) || '' });
    const now = h('button', { type: 'button', className: 'link', textContent: 'Use current time', onclick: () => { inp.value = fmtT(au.currentTime); } });
    const go = h('button', { type: 'button', className: 'link', textContent: 'Play from here', onclick: () => {
      const s = parseT(inp.value); if (s != null && !Number.isNaN(s)) { au.currentTime = s; au.play(); }
    } });
    return { inp, row: h('div', { className: 'trow' }, thumb, h('span', { textContent: `Page ${i + 1}` }), inp, now, go) };
  });
  const save = h('button', { className: 'btn', textContent: 'Save timings', onclick: async () => {
    const vals = inputs.map(x => parseT(x.inp.value));
    if (vals.some(v => Number.isNaN(v))) return msg.textContent = 'Use the format m:ss, for example 1:25.';
    let prev = -1;
    for (const v of vals) { if (v == null) continue; if (v < prev) return msg.textContent = 'Times must increase from one page to the next.'; prev = v; }
    msg.textContent = 'Saving...';
    const res = await Promise.all(list.map((p, i) =>
      sb.from('pages').update({ start_time: vals[i] }).eq('chapter_id', ch.id).eq('position', p.position).select()));
    const err = res.find(r => r.error);
    if (err) msg.textContent = 'Save failed: ' + err.error.message;
    else if (res.some(r => !r.data || !r.data.length)) msg.textContent = 'Nothing was saved. Check that the start_time column and the admin update policy exist (see setup SQL).';
    else msg.textContent = 'Saved.';
  } });
  const close = h('button', { type: 'button', className: 'link', textContent: 'Close', onclick: () => { au.pause(); box.classList.add('hidden'); box.replaceChildren(); } });
  box.replaceChildren(
    h('h3', { textContent: 'Page timings: ' + ch.title }),
    h('p', { className: 'note', textContent: 'Play the audio. When a page should appear, click "Use current time" on that page, or type the time as m:ss. Page 1 starts at 0:00. Leave later pages blank to skip them.' }),
    au,
    ...(list.length ? inputs.map(x => x.row) : [h('p', { className: 'note', textContent: 'This chapter has no pages yet. Upload page images first.' })]),
    h('div', { style: 'display:flex;gap:24px;align-items:center' }, save, close),
    msg
  );
}

/* ---------- admin: chapters ---------- */
function renderRows() {
  const box = $('rows');
  if (!chapters.length) return box.replaceChildren(h('p', { className: 'empty', textContent: 'No entries yet.' }));
  box.replaceChildren(...flat().map(({ c: ch, d }) => {
    const pos = h('input', { type: 'text', value: ch.position, inputMode: 'numeric', ariaLabel: 'Position' });
    const ti = h('input', { type: 'text', value: ch.title, ariaLabel: 'English title', placeholder: 'English title' });
    const tg = h('input', { type: 'text', value: ch.title_gu || '', ariaLabel: 'Gujarati title', placeholder: 'Gujarati title' });
    const bad = new Set([ch.id, ...desc(ch).map(x => x.id)]), ht = heightOf(ch);
    const par = h('select', { ariaLabel: 'Parent' }, h('option', { value: '', textContent: 'Top level' }),
      ...flat().filter(x => !bad.has(x.c.id) && x.d + ht <= 3).map(x => h('option', { value: x.c.id, textContent: pad(x.d) + x.c.title })));
    par.value = ch.parent_id || '';
    const save = h('button', { className: 'link', textContent: 'Save', onclick: async () => {
      const r = await sb.from('chapters').update({ title: ti.value, title_gu: tg.value || null, position: +pos.value, parent_id: +par.value || null }).eq('id', ch.id);
      if (r.error) alert(r.error.message); loadChapters();
    } });
    const tim = ch.audio_path ? h('button', { className: 'link', textContent: 'Timings', onclick: () => openTiming(ch) }) : h('span');
    const add = d < 3 ? h('button', { className: 'link', textContent: '+ Sub', onclick: () => {
      tab('up'); $('target').value = ''; syncTarget(); $('parent').value = ch.id; $('cTitle').focus();
    } }) : h('span');
    const del = h('button', { className: 'link', textContent: 'Delete', onclick: async () => {
      const all = [ch, ...desc(ch)], n = all.length - 1;
      if (!confirm(`Delete "${ch.title}"${n ? ` and its ${n} sub-section(s)` : ''}, with all audio and pages?`)) return;
      const { data: pg } = await sb.from('pages').select('image_path').in('chapter_id', all.map(x => x.id));
      const files = [...all.map(x => x.audio_path).filter(Boolean), ...(pg || []).map(p => p.image_path)];
      if (files.length) await sb.storage.from(B).remove(files);
      await sb.from('chapters').delete().eq('id', ch.id); await loadChapters(); loadStats();
    } });
    const row = h('div', { className: 'row' }, pos, ti, tg, par, save, tim, add, del);
    row.style.marginLeft = (d - 1) * 22 + 'px'; return row;
  }));
}

/* ---------- admin: members ---------- */
async function loadMembers() {
  const { data } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  $('mrows').replaceChildren(...(data || []).map(u => {
    const self = u.id === me.id;
    const acc = h('button', { className: 'link', textContent: u.approved ? 'Active (pause)' : 'Paused (allow)', disabled: self,
      onclick: async () => { await sb.from('profiles').update({ approved: !u.approved }).eq('id', u.id); loadMembers(); } });
    const rol = h('button', { className: 'link', textContent: u.is_admin ? 'Admin (remove)' : 'Member (make admin)', disabled: self,
      onclick: async () => { await sb.from('profiles').update({ is_admin: !u.is_admin }).eq('id', u.id); loadMembers(); } });
    return h('tr', {}, h('td', { textContent: u.full_name || '-' }), h('td', { textContent: u.email }),
      h('td', { textContent: fmt(u.created_at) }), h('td', { textContent: fmt(u.last_seen) }), h('td', {}, acc), h('td', {}, rol));
  }));
}
