<style>
:root{--bg:#fff;--panel:#f7f5f0;--ink:#1c1e3a;--mute:#6b6e8a;--gold:#a6853c;--line:rgba(166,133,60,.3)}

.wrap{max-width:1100px;margin:0 auto;padding:0 24px}

.brand{font:300 1.5rem Inter,'Noto Serif Gujarati',serif;letter-spacing:.08em}

form{display:grid;gap:18px;max-width:320px;margin:0 auto;text-align:left}
input[type=email],input[type=password],input[type=text]{background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;width:100%}
input::placeholder{color:#6d7091}
.btn{background:none;border:1px solid var(--gold);color:var(--gold);padding:12px 28px;cursor:pointer;letter-spacing:.12em;transition:.3s}

label{display:grid;gap:6px;color:var(--mute);font-size:.9rem}

.pgbox{display:grid;grid-template-columns:70px 70px 100px 110px 1fr 1fr;gap:10px 14px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}
.pgbox .subs{grid-column:1/-1;display:grid;grid-template-columns:70px 70px 100px 110px 1fr 1fr;gap:10px 14px;align-items:center}

.pgbox .subs select{grid-column:3}
.pgbox .subs .gocell{grid-column:5/7;display:flex;gap:20px;align-items:center}

.pgbox img{width:60px;height:80px;object-fit:cover;border:1px solid var(--line)}
.pgbox .act{background:none;border:0;border-bottom:1px solid transparent;padding:0;margin:0;cursor:pointer;color:var(--mute);font:300 16px/1.7 Inter,'Noto Sans Gujarati',sans-serif;letter-spacing:normal;text-align:left;justify-self:start;white-space:nowrap;-webkit-appearance:none;appearance:none}
.pgbox .act:hover,.pgbox .act:focus-visible{color:var(--gold);border-bottom-color:var(--gold)}
.pgbox .plabel{white-space:nowrap}
.pgbox .pickl{border:0;border-bottom:1px solid transparent;background:none;color:var(--mute);cursor:pointer;padding:0;font:inherit;justify-self:start;max-width:100%}
.pgbox .pickl:hover{color:var(--gold);border-bottom-color:var(--gold)}
.pgbox .pickl option{color:var(--ink);background:#fff}
.chips{display:inline-flex;gap:14px;flex-wrap:wrap;align-items:center}
.chip{color:var(--mute)}
.chip .act{padding:0 0 0 4px}
.modenote{color:var(--gold);font-size:.9rem}
@media(max-width:800px){#lib{grid-template-columns:1fr;gap:32px;padding-top:32px}.pgbox{grid-template-columns:60px 1fr}.pgbox>*,.pgbox .subs>*{grid-column:auto!important}.pgbox .subs{grid-template-columns:60px 1fr}}

#authForm input:focus{outline:0;border-color:#fff;background:rgba(255,255,255,.25)}
#authForm .btn{background:rgba(255,255,255,.88);color:#1c1e3a;border:0;border-radius:6px;padding:8px 24px;letter-spacing:.1em}
#authForm .btn:hover{background:#c2a566;color:#1c1e3a}
#authForm .link{color:rgba(255,255,255,.85);text-align:center;font-size:.85rem}
#authForm .link:hover{color:#fff;border-color:#fff}
#authForm .msg{color:#f3e2b3;text-align:center;font-size:.82rem;min-height:0;line-height:1.3}
#toc li button{padding-left:calc(18px + (var(--d,1) - 1)*20px)}

#toc li button[data-d="2"]{font-size:1.05rem}#toc li button[data-d="3"]{font-size:.95rem}
header .right{display:flex;gap:22px;align-items:center;margin-left:auto}
</style>
</head>

<script>
/* Runs before anything paints: signed-in visitors see a blank page until the library is ready; guests see the cover at once */
try{var k=Object.keys(localStorage).some(function(x){return /^sb-.*-auth-token$/.test(x)});document.body.classList.add(k?'boot':'home')}catch(e){document.body.classList.add('home')}

<div class="wrap">
<header>
  <div class="brand" id="brand"></div>
  <div class="right">
    <nav id="nav" class="hidden">
      <button class="link" id="goLib" data-i="library">Library</button>
      <button class="link hidden" id="goAdmin" data-i="admin">Admin</button>
      <button class="link" id="out" data-i="out">Sign out</button>
    </nav>

<section id="auth">
  <div>
    <h1 id="bookTitle"></h1>
    <p class="sub" id="bookTag"></p>

      <input type="text" id="nm" placeholder="Your name" data-p="name" class="hidden" autocomplete="name">

  </div>

  <div class="pane" id="p-up">
    <form id="upForm" style="max-width:none">
      <label>Add to<select id="target"></select></label>
      <label id="titleL">Chapter title (English)<input type="text" id="cTitle"></label>
      <label id="guL">Chapter title (Gujarati)<input type="text" id="cTitleGu"></label>
      <label id="parentL">Place under<select id="parent"></select></label>
      <label id="posL">Position among siblings (blank = at the end)<input type="text" id="cPos" inputmode="numeric"></label>
      <div class="drop" id="dropA" tabindex="0">Drop audio files here, or click to choose<br><small>Several tracks are allowed. New tracks are added after any existing ones.</small><br><small id="aName"></small></div>
      <div class="drop" id="dropI" tabindex="0">Drop page images here, or click to choose<br><small id="iName"></small></div>

  <div class="pane wide hidden" id="p-mem"><div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Last seen</th><th>Access</th><th>Role</th></tr></thead><tbody id="mrows"></tbody></table></div></div>
</div>
</section>
</div>

<script>
/* ====== EDIT THESE ====== */
const SUPABASE_URL = 'https://lpowlcdawtpdttmahxaw.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxwb3dsY2Rhd3RwZHR0bWFoeGF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzgyOTAsImV4cCI6MjEwNjIxNDI5MH0.E5zXL0RL9cljYUBEslPXKxyuU5buKbC30pxWNltTiUs';
const BOOK = { title: 'Shrimad Rajchandra Vachnamrutji', tagline: 'જેણે આત્મા જાણ્યો તેણે સર્વ જાણ્યું.' };
const QUOTA_MB = 1024; /* Supabase free storage */
/* ======================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const h = (t, p = {}, ...k) => { const e = Object.assign(document.createElement(t), p); e.append(...k); return e; };
const B = 'book', safe = n => n.replace(/[^a-zA-Z0-9._-]/g, '_');
const fmt = d => d ? new Date(d).toLocaleDateString() : '-';
let signup = false, me = {}, chapters = [], current = null, audioFiles = [], imgFiles = [], tracksAll = [];

$('brand').textContent = $('bookTitle').textContent = document.title = BOOK.title;
$('bookTag').textContent = BOOK.tagline;

/* Interface text is English only. Only chapter titles (the index) are Gujarati. */
const T = {
  library: 'Library', admin: 'Admin', out: 'Sign out', contents: 'Contents', choose: 'Choose a chapter to begin.',
  name: 'Your name', email: 'Email', pass: 'Password (6+ characters)', signin: 'Sign in', create: 'Create account',
  'new': 'New here? Create an account', have: 'Already registered? Sign in',
  check: 'Check your email to confirm, then sign in.', paused: 'Your access is paused. Please contact the administrator.',
  empty: 'Chapters will appear here.', pickSub: 'Choose a sub-section from the contents.'
};
const t = k => T[k];
function applyLang() {
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e => e.placeholder = t(e.dataset.p));
  $('authBtn').textContent = t(signup ? 'create' : 'signin');
  $('toggle').textContent = t(signup ? 'have' : 'new');
}
applyLang();
const store = { get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} } };
const show = v => {
  if (v !== 'auth') store.set('view', v);
  document.body.classList.remove('boot');
  if (v !== 'lib') stopBar();
  document.body.classList.toggle('home', v === 'auth');
  ['auth', 'lib', 'admin'].forEach(s => $(s).classList.toggle('hidden', s !== v));
};

/* safety net: if the sign-in check never answers, show the sign-in page */
setTimeout(() => { if (document.body.classList.contains('boot')) show('auth'); }, 5000);

/* ---------- auth ---------- */
$('toggle').onclick = () => {
  signup = !signup;
  $('nm').classList.toggle('hidden', !signup);
  applyLang();
  $('authMsg').textContent = '';
};
$('authForm').onsubmit = async e => {
  e.preventDefault();
  const c = { email: $('em').value, password: $('pw').value };
  if (signup) c.options = { data: { full_name: $('nm').value }, emailRedirectTo: window.location.origin };
  const { data, error } = signup ? await sb.auth.signUp(c) : await sb.auth.signInWithPassword(c);
  if (error) return $('authMsg').textContent = error.message;
  if (signup && !data.session) $('authMsg').textContent = t('check');
};
$('out').onclick = () => sb.auth.signOut();
$('goLib').onclick = () => { show('lib'); loadChapters(); };
$('goAdmin').onclick = () => { show('admin'); tab('up'); loadChapters(); loadStats(); };

let shownUid = null;
sb.auth.onAuthStateChange(async (_e, s) => {
  $('nav').classList.toggle('hidden', !s);
  if (!s) { me = {}; bms = []; shownUid = null; return show('auth'); }
  /* Supabase re-fires this on token refresh and when the tab regains focus.
     If the same user is already signed in, do nothing so the current page (e.g. admin) stays put. */
  if (shownUid === s.user.id) return;
  shownUid = s.user.id;
  setTimeout(async () => {
    sb.rpc('touch_me');
    const { data } = await sb.from('profiles').select('*').eq('id', s.user.id).single();
    me = data || {};
    $('goAdmin').classList.toggle('hidden', !me.is_admin);
    if (me.is_admin && store.get('view') === 'admin') { show('admin'); tab(store.get('atab') || 'up'); loadChapters(); loadStats(); return; }
    show('lib');
    if (!me.approved && !me.is_admin) $('reader').replaceChildren(h('p', { className: 'empty', textContent: t('paused') }));
    else loadChapters().then(loadBookmarks);
  });
});

/* ---------- bookmarks (saved per user; falls back to this browser if the bookmarks table is missing) ---------- */
let bms = [], bmRemote = true;
const bmLocal = {
  get: () => { try { return JSON.parse(localStorage.getItem('bm:' + me.id) || '[]'); } catch (e) { return []; } },
  set: a => { try { localStorage.setItem('bm:' + me.id, JSON.stringify(a)); } catch (e) {} }
};
async function loadBookmarks() {
  const r = await sb.from('bookmarks').select('*').eq('user_id', me.id);
  if (r.error) { bmRemote = false; bms = bmLocal.get(); }
  else { bmRemote = true; bms = (r.data || []).map(x => ({ chapter_id: x.chapter_id, ti: x.track_index, t: Number(x.position_sec) || 0, at: x.created_at })); }
  bms.sort((a, b) => String(b.at).localeCompare(String(a.at)));
  renderBookmarks();
}
async function saveBookmark(b) {
  b.at = new Date().toISOString();
  bms = [b, ...bms.filter(x => x.chapter_id !== b.chapter_id)];
  if (bmRemote) {
    const r = await sb.from('bookmarks').upsert({ user_id: me.id, chapter_id: b.chapter_id, track_index: b.ti, position_sec: b.t, created_at: b.at }, { onConflict: 'user_id,chapter_id' });
    if (r.error) bmRemote = false;
  }
  if (!bmRemote) bmLocal.set(bms);
  renderBookmarks();
}
async function deleteBookmark(cid) {
  bms = bms.filter(x => x.chapter_id !== cid);
  if (bmRemote) await sb.from('bookmarks').delete().eq('user_id', me.id).eq('chapter_id', cid); else bmLocal.set(bms);
  renderBookmarks();
}
function resumeBookmark(b) {
  const ch = chapters.find(c => c.id === b.chapter_id); if (!ch) return;
  for (let p = chapters.find(c => c.id === ch.parent_id); p; p = chapters.find(c => c.id === p.parent_id)) expanded.add(p.id);
  renderToc(); window.scrollTo({ top: 0, behavior: 'smooth' });
  openChapter(ch, true, { ti: b.ti || 0, t: b.t || 0 });
}
function renderBookmarks() {

/* ---------- reader ---------- */
const kids = id => chapters.filter(c => c.parent_id === id).sort((a, b) => a.position - b.position);
const flat = (pid = null, d = 1) => kids(pid).flatMap(c => [{ c, d }, ...flat(c.id, d + 1)]);
const desc = c => kids(c.id).flatMap(k => [k, ...desc(k)]);
const heightOf = c => 1 + Math.max(0, ...kids(c.id).map(heightOf));
const pad = d => '\u00A0\u00A0'.repeat(d - 1);
const expanded = new Set();
/* Chapter titles always show in Gujarati, falling back to English if none entered */
const ttl = c => c.title_gu || c.title;
/* all audio tracks of a chapter, in order (falls back to the old single audio_path) */
const tracksOf = ch => {
  const r = tracksAll.filter(x => x.chapter_id === ch.id).sort((a, b) => a.position - b.position);
  return r.length ? r : (ch.audio_path ? [{ id: null, chapter_id: ch.id, position: 1, audio_path: ch.audio_path }] : []);
};

/* time helpers: "1:25" <-> seconds */
const parseT = s => {
  s = String(s).trim(); if (!s) return null;
  const p = s.split(':').map(Number);
  if (p.length > 3 || p.some(x => Number.isNaN(x) || x < 0)) return NaN;
  return p.reduce((a, x) => a * 60 + x, 0);
};
const fmtT = s => {
  if (s == null) return '';
  s = Math.floor(s);
  const hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  return (hh ? hh + ':' + String(mm).padStart(2, '0') : mm) + ':' + String(ss).padStart(2, '0');
};

let nextTimer = null;

function renderToc() {

    const k = kids(ch.id);
    const b = h('button', { textContent: (k.length ? (expanded.has(ch.id) ? '\u25BE ' : '\u25B8 ') : '') + ttl(ch), onclick: () => {

    ol.append(h('li', {}, b));

/* after the last track of a chapter: announce the next chapter, then continue unless the user presses Stop */
function offerNext(ch, au) {
  const order = []; const walk = pid => kids(pid).forEach(c => { order.push(c); walk(c.id); }); walk(null);
  let nx = null;
  for (let j = order.findIndex(c => c.id === ch.id) + 1; j > 0 && j < order.length; j++) if (tracksOf(order[j]).length) { nx = order[j]; break; }
  const bar = $('bar'); const old = bar.querySelector('.nextup'); if (old) old.remove();
  clearInterval(nextTimer);
  if (!nx) { bar.prepend(h('div', { className: 'nextup' }, h('span', { textContent: 'That was the last chapter.' }))); return; }
  let left = 5;
  const msg = h('span');
  const upd = () => { msg.replaceChildren('Next: ', h('b', { textContent: ttl(nx) }), ` \u2014 starting in ${left}s`); };
  const go = () => {
    clearInterval(nextTimer);
    for (let p = chapters.find(c => c.id === nx.parent_id); p; p = chapters.find(c => c.id === p.parent_id)) expanded.add(p.id);
    renderToc(); window.scrollTo({ top: 0, behavior: 'smooth' });
    openChapter(nx, true);
  };
  const stop = h('button', { type: 'button', className: 'link', textContent: 'Stop', onclick: () => { clearInterval(nextTimer); row.remove(); } });
  const now = h('button', { type: 'button', className: 'link', textContent: 'Play now', onclick: go });
  const row = h('div', { className: 'nextup' }, msg, stop, now);
  upd(); bar.prepend(row);
  nextTimer = setInterval(() => { if (--left <= 0) go(); else upd(); }, 1000);
}

async function openChapter(ch, auto, resume) {
  current = ch.id;
  document.querySelectorAll('#chapters button').forEach(b => b.setAttribute('aria-current', b.dataset.id == ch.id));
  const tr = tracksOf(ch);
  const [{ data: a }, { data: pgs }] = await Promise.all([
    tr.length ? sb.storage.from(B).createSignedUrls(tr.map(x => x.audio_path), 7200) : Promise.resolve({ data: [] }),
    sb.from('pages').select('*').eq('chapter_id', ch.id).order('position')
  ]);
  if (current !== ch.id) return; /* user already clicked another chapter */
  const aurls = (a || []).map(x => x.signedUrl);
  const list = pgs || [];
  let urls = [];
  if (list.length) {
    const { data: u } = await sb.storage.from(B).createSignedUrls(list.map(p => p.image_path), 7200);
    urls = (u || []).map(x => x.signedUrl);
  }
  if (current !== ch.id) return;

  stopBar();
  const parts = [h('h2', { textContent: ttl(ch) })];
  /* page-by-page mode: pages have their own track lists. timed mode: one audio, pages appear at set times. */
  const keepR = p => Array.isArray(p.track_nums) ? p.track_nums.map((n, k) => k).filter(k => aurls[p.track_nums[k] - 1]) : [];
  const lists = list.map(p => keepR(p).map(k => p.track_nums[k]));
  const lstart = list.map(p => keepR(p).map(k => Number(p.track_times && p.track_times[k]) || 0));
  const playlist = lists.some(l => l.length);
  const timed = !playlist && aurls.length > 0 && list.some(p => p.start_time != null);

  if (aurls.length) {
    const au = h('audio', { controls: true, preload: 'metadata' });
    const lab = h('span', { className: 'trk' });
    /* what plays, in order: every page's own tracks, page by page, or simply all tracks of the chapter */
    const q = [];
    if (playlist) lists.forEach((l, pi) => l.forEach((tn, k) => q.push({ tn, pi, st: lstart[pi][k] })));
    else aurls.forEach((_, i) => q.push({ tn: i + 1, pi: -1 }));
    const multi = q.length > 1;
    let ti = 0, sync = () => {};
    const prev = h('button', { type: 'button', className: 'link tbtn', textContent: '\u2039', ariaLabel: 'Previous track', onclick: () => setTrack(ti - 1, true) });
    const next = h('button', { type: 'button', className: 'link tbtn', textContent: '\u203A', ariaLabel: 'Next track', onclick: () => setTrack(ti + 1, true) });
    const setTrack = (i, play) => {
      if (i < 0 || i >= q.length) return;
      ti = i; au.src = aurls[q[i].tn - 1];
      if (q[i].st > 0) { const t0 = q[i].st, go0 = () => { au.removeEventListener('loadedmetadata', go0); au.currentTime = t0; }; au.addEventListener('loadedmetadata', go0); }
      lab.textContent = 'Track ' + (i + 1) + ' / ' + q.length;
      prev.disabled = i === 0; next.disabled = i === q.length - 1;
      if (play) au.play().catch(() => {});
      sync();
    };
    /* when a track finishes, continue with the next one */
    au.addEventListener('ended', () => { if (ti < q.length - 1) setTrack(ti + 1, true); else offerNext(ch, au); });
    /* any new playback cancels the \"next chapter\" countdown */
    au.addEventListener('play', () => { clearInterval(nextTimer); const n = $('bar').querySelector('.nextup'); if (n) n.remove(); });

    /* playback speed (remembered; defaultPlaybackRate keeps it when the track changes) */
    let saved = 1; try { saved = parseFloat(localStorage.getItem('speed')) || 1; } catch (e) {}
    if (![0.75, 1, 1.25, 1.5, 1.75, 2].includes(saved)) saved = 1;
    au.defaultPlaybackRate = au.playbackRate = saved;
    const SP = [0.75, 1, 1.25, 1.5, 1.75, 2];
    const spd = h('span', { className: 'spds', role: 'group', ariaLabel: 'Playback speed' });
    const spBtns = SP.map(v => h('button', { type: 'button', className: 'link sp', textContent: v + 'x', title: 'Speed ' + v + 'x', onclick: () => setSpd(v) }));
    const setSpd = v => {
      au.defaultPlaybackRate = au.playbackRate = v;
      spBtns.forEach((b, k) => { b.setAttribute('aria-pressed', SP[k] === v); b.classList.toggle('on', SP[k] === v); });
      try { localStorage.setItem('speed', v); } catch (e) {}
    };
    spd.append(...spBtns);
    setSpd(saved);

    const bmk = h('button', { type: 'button', className: 'link bmk', textContent: 'Bookmark', title: 'Save this spot and resume later',
      onclick: async () => {
        await saveBookmark({ chapter_id: ch.id, ti, t: Math.floor(au.currentTime) });
        bmk.textContent = 'Saved \u2713'; setTimeout(() => { bmk.textContent = 'Bookmark'; }, 1800);
      } });

    $('bar').append(h('div', { className: 'in' }, h('span', { className: 'nowp', textContent: ttl(ch) }),
      multi ? h('span', { className: 'tctl' }, prev, lab, next) : '', au, spd, bmk));
    $('bar').classList.remove('hidden');
    document.body.classList.add('hasbar');

    if (playlist) {
      const img = h('img'), no = h('div', { className: 'pgno' });
      parts.push(h('div', { className: 'stage' }, img, no));
      let shown = -1;
      sync = () => {
        const pi = q[ti].pi;
        if (pi === shown) return;
        const first = shown === -1; shown = pi;
        img.src = urls[pi] || ''; img.alt = `${ttl(ch)}, page ${pi + 1}`;
        no.textContent = `${pi + 1} / ${list.length}`;
        if (urls[pi + 1]) new Image().src = urls[pi + 1];
        if (!first) window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    } else if (timed) {
      const trk = list.map(p => p.track || 1);
      const starts = list.map((p, i) => p.start_time != null ? Number(p.start_time) : (i === 0 ? 0 : Infinity));
      const img = h('img'), no = h('div', { className: 'pgno' });
      parts.push(h('div', { className: 'stage' }, img, no));
      let shown = -1;
      sync = () => {
        const now = au.currentTime, cur = q[ti].tn; let idx = 0;
        starts.forEach((s, i) => { if (Number.isFinite(s) && (trk[i] < cur || (trk[i] === cur && s <= now))) idx = i; });
        if (idx === shown) return;
        const first = shown === -1; shown = idx;
        img.src = urls[idx] || ''; img.alt = `${ttl(ch)}, page ${idx + 1}`;
        no.textContent = `${idx + 1} / ${list.length}`;
        if (urls[idx + 1]) new Image().src = urls[idx + 1]; /* preload next page */
        if (!first) window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      ['timeupdate', 'seeked', 'loadedmetadata'].forEach(ev => au.addEventListener(ev, () => sync()));
    }
    const rs = resume && resume.ti < q.length ? resume : null;
    setTrack(rs ? rs.ti : 0, !!auto);
    if (rs && rs.t > 0) { const go1 = () => { au.removeEventListener('loadedmetadata', go1); au.currentTime = rs.t; }; au.addEventListener('loadedmetadata', go1); }
  }

  if (!timed && !playlist && list.length) {
    const box = h('div', { className: 'pages' });
    urls.forEach((src, i) => box.append(h('img', { alt: `${ttl(ch)}, page ${i + 1}`, loading: 'lazy', src })));
    parts.push(box);
  }
  if (!aurls.length && !list.length) parts.push(h('p', { className: 'empty', textContent: t('pickSub') }));
  $('reader').replaceChildren(...parts);
  window.scrollTo({ top: 0 });
}

async function shrink(f) {
  if (!$('cmp').checked) return { blob: f, name: safe(f.name) };
  const bm = await createImageBitmap(f), s = Math.min(1, 1600 / bm.width), c = document.createElement('canvas');
  c.width = Math.round(bm.width * s); c.height = Math.round(bm.height * s);
  c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/webp', .82));
  return blob ? { blob, name: safe(f.name).replace(/\.[^.]+$/, '') + '.webp' } : { blob: f, name: safe(f.name) };
}

$('upForm').onsubmit = async e => {
  e.preventDefault();
  const m = $('upMsg'), tid = $('target').value, total = imgFiles.length + audioFiles.length;
  let done = 0; const tick = () => $('upbar').style.width = (++done / total * 100) + '%';
  try {
    if (!total && tid) throw new Error('Choose audio files or page images.');
    let ch = chapters.find(c => c.id == tid), folder, up = async (p, f, o) => { const r = await sb.storage.from(B).upload(p, f, o); if (r.error) throw r.error; };
    const trs = ch ? tracksOf(ch) : [];
    if (!ch) {
      if (!$('cTitle').value) throw new Error('Please enter a title.');
      folder = crypto.randomUUID();
    } else {
      folder = trs.length ? trs[0].audio_path.split('/')[0] : 'node-' + ch.id;
    }
    /* upload every audio file first */

    for (const f of audioFiles) {

      const ap = `${folder}/audio-${Date.now()}-${aps.length + 1}-${safe(f.name)}`;

    }

      const pos = $('cPos').value ? +$('cPos').value : (sib.length ? Math.max(...sib.map(x => x.position)) + 1 : 1);
      const r = await sb.from('chapters').insert({ title: $('cTitle').value, position: pos, parent_id: pid, audio_path: null, title_gu: $('cTitleGu').value || null }).select().single();
      if (r.error) throw r.error; ch = r.data;
    } else if (aps.length && trs.length && !trs[0].id) {
      /* chapter still has its old single audio: move it into the tracks list as track 1 */
      const r = await sb.from('tracks').insert({ chapter_id: ch.id, position: 1, audio_path: trs[0].audio_path });
      if (r.error) throw r.error;
      await sb.from('chapters').update({ audio_path: null }).eq('id', ch.id);
    }
    if (aps.length) {
      const base = trs.length;
      const r = await sb.from('tracks').insert(aps.map((path, k) => ({ chapter_id: ch.id, position: base + k + 1, audio_path: path })));
      if (r.error) throw r.error;
    }
    const { data: last } = await sb.from('pages').select('position').eq('chapter_id', ch.id).order('position', { ascending: false }).limit(1);
    let n = last && last.length ? last[0].position : 0; const rows = [];

  /* each page's own list of tracks (numbers from the chapter's uploaded tracks) */
  const keepIdx = p => Array.isArray(p.track_nums) ? p.track_nums.map((n, k) => k).filter(k => p.track_nums[k] >= 1 && p.track_nums[k] <= tr.length) : [];
  const lists = list.map((p, i) => st && st.draft && st.draft[i] ? st.draft[i].list.slice() : keepIdx(p).map(k => p.track_nums[k]));
  /* start time (m:ss text) for each audio in each page's list */
  const times = list.map((p, i) => st && st.draft && st.draft[i] && st.draft[i].times ? st.draft[i].times.slice()
    : keepIdx(p).map(k => fmtT(Number(p.track_times && p.track_times[k]) || 0)));
  lists.forEach((l, i) => { while (times[i].length < l.length) times[i].push('0:00'); times[i].length = l.length; });
  const redraw = [];
  const renderAll = () => {
    redraw.forEach(f => f());
    modeNote.textContent = lists.some(l => l.length)
      ? 'Page-by-page mode: each page plays its own audio in order, each starting at its own time, then the next page follows. The page start times in the top row of each page are not used.'
      : '';
  };
  const capture = () => inputs.map((x, j) => ({ time: x.inp.value, track: x.tsel.value, list: lists[j].slice(), times: times[j].slice() }));

  const inputs = list.map((p, i) => {
    const dr = st && st.draft && st.draft[i];
    const inp = h('input', { type: 'text', placeholder: 'm:ss', ariaLabel: `Page ${i + 1} start time`,
      value: dr ? dr.time : (p.start_time != null ? fmtT(p.start_time) : (i === 0 ? '0:00' : '')) });
    const tsel = h('select', { ariaLabel: `Page ${i + 1} track` }, ...tr.map((_, k) => h('option', { value: k + 1, textContent: 'Track ' + (k + 1) })));
    tsel.value = dr ? dr.track : Math.min(p.track || 1, tr.length);
    const thumb = h('img', { alt: `Page ${i + 1}`, src: (u && u[i] && u[i].signedUrl) || '' });
    const now = h('button', { type: 'button', className: 'link act', textContent: 'Use current time', onclick: () => { if (pv < 0) return; inp.value = fmtT(au.currentTime); tsel.value = pv + 1; } });
    const go = h('button', { type: 'button', className: 'link act', textContent: 'Play from here', onclick: () => {
      let s = parseT(inp.value); if (Number.isNaN(s)) return; if (s == null) s = 0;
      loadTrack((+tsel.value || 1) - 1, () => { au.currentTime = s; au.play(); });
    } });

    const rem = h('button', { type: 'button', className: 'link act', textContent: 'Remove', title: 'Remove this page image',
      ariaLabel: `Remove page ${i + 1}`,
      onclick: async () => {
        if (!confirm(`Remove page ${i + 1} and its image? Later pages move up by one.`)) return;
        msg.textContent = 'Removing page...';
        const d = capture(); d.splice(i, 1);
        const r = await sb.from('pages').delete().eq('chapter_id', ch.id).eq('position', p.position);
        if (r.error) return msg.textContent = 'Could not remove: ' + r.error.message;
        if (p.image_path) await sb.storage.from(B).remove([p.image_path]);
        for (const q of list.slice(i + 1)) {
          const u2 = await sb.from('pages').update({ position: q.position - 1 }).eq('chapter_id', ch.id).eq('position', q.position);
          if (u2.error) { msg.textContent = 'Renumbering failed: ' + u2.error.message; break; }
        }
        await loadChapters(); loadStats();
        openTiming(chapters.find(c => c.id === ch.id) || ch, { draft: d, note: `Page ${i + 1} removed. Other unsaved edits are kept. Click "Save timings" to keep them.` });
      } });

    /* under each page: its own audio list; every audio gets the same row pattern as the page row */
    const subs = h('div', { className: 'subs' });
    const hint = h('span', { className: 'hint' });
    const opts = h('span', { className: 'chips opts hidden' }, ...tr.map((_, k) => h('button', { type: 'button', className: 'link act', textContent: 'Track ' + (k + 1),
      onclick: () => { lists[i].push(k + 1); times[i].push('0:00'); opts.classList.add('hidden'); renderAll(); } })));
    const pick = h('button', { type: 'button', className: 'link act', textContent: '+ Pick an uploaded track',
      onclick: () => opts.classList.toggle('hidden') });
    const upl = h('button', { type: 'button', className: 'link act', textContent: '+ Upload new track',
      title: 'Upload audio and add it to this page',
      onclick: () => {
        const before = tr.length;
        pickTracks(ch, s => { msg.textContent = s; }, () => {
          const ch2 = chapters.find(c => c.id === ch.id) || ch, n2 = tracksOf(ch2).length;
          const d = capture(); for (let k = before + 1; k <= n2; k++) { d[i].list.push(k); d[i].times.push('0:00'); }
          openTiming(ch2, { draft: d, note: `Added to page ${i + 1}. Click \"Save timings\" to keep it.` });
        });
      } });
    redraw.push(() => {
      const rows = [];
      lists[i].forEach((n, k) => {
        const asel = h('select', { ariaLabel: `Page ${i + 1} audio ${k + 1} track` }, ...tr.map((_, j) => h('option', { value: j + 1, textContent: 'Track ' + (j + 1) })));
        asel.value = n; asel.onchange = () => { lists[i][k] = +asel.value; };
        const ainp = h('input', { type: 'text', placeholder: 'm:ss', ariaLabel: `Page ${i + 1} audio ${k + 1} start time`, value: times[i][k] });
        ainp.oninput = () => { times[i][k] = ainp.value; };
        const anow = h('button', { type: 'button', className: 'link act', textContent: 'Use current time', onclick: () => {
          if (pv < 0) return; ainp.value = times[i][k] = fmtT(au.currentTime); asel.value = lists[i][k] = pv + 1; } });
        const ago = h('button', { type: 'button', className: 'link act', textContent: 'Play from here', onclick: () => {
          let t0 = parseT(ainp.value); if (Number.isNaN(t0)) return; if (t0 == null) t0 = 0;
          loadTrack((+asel.value || 1) - 1, () => { au.currentTime = t0; au.play(); });
        } });
        const del = h('button', { type: 'button', className: 'link act', textContent: '\u00D7', title: 'Remove this audio', ariaLabel: `Remove audio ${k + 1} from page ${i + 1}`,
          onclick: () => { lists[i].splice(k, 1); times[i].splice(k, 1); renderAll(); } });
        rows.push(h('span', { className: 'plabel', textContent: k === 0 ? 'Page audio:' : '' }), asel, ainp, anow, h('span', { className: 'gocell' }, ago, del));
      });
      if (!rows.length) rows.push(h('span', { className: 'plabel', textContent: 'Page audio:' }), h('span', { className: 'note', textContent: 'none yet' }));
      subs.replaceChildren(...rows);
      hint.textContent = lists.some(l => l.length) && !lists[i].length ? 'No audio on this page, so it is skipped while playing.' : '';
    });
    return { inp, tsel,
      row: h('div', { className: 'pgbox' }, thumb, h('span', { textContent: `Page ${i + 1}` }), tr.length ? tsel : h('span'), inp, now, go,
        subs, rem, hint, tr.length ? pick : h('span'), upl, opts) };
  });
  renderAll();
  if (st && st.note) msg.textContent = st.note;

  const save = h('button', { className: 'btn', textContent: 'Save timings', onclick: async () => {
    const vals = inputs.map(x => parseT(x.inp.value)), trs = inputs.map(x => +x.tsel.value || 1);
    if (vals.some(v => Number.isNaN(v))) return msg.textContent = 'Use the format m:ss, for example 1:25.';
    if (!lists.some(l => l.length)) { /* times only matter when no page has its own track list */
      let prevKey = -1, prevPage = 0;
      for (let i = 0; i < vals.length; i++) {
        if (vals[i] == null) continue;
        const key = trs[i] * 1e7 + vals[i];
        if (key < prevKey) return msg.textContent = `Page ${i + 1} is set earlier than page ${prevPage}. Times must increase from page to page, and tracks must stay in order.`;
        prevKey = key; prevPage = i + 1;
      }
    }
    const atimes = times.map(arr => arr.map(x => parseT(x)));
    if (atimes.some(arr => arr.some(v => Number.isNaN(v)))) return msg.textContent = 'Use the format m:ss for audio start times, for example 1:25.';
    atimes.forEach((arr, i) => arr.forEach((v, k) => { if (v == null) arr[k] = 0; }));
    msg.textContent = 'Saving...';
    const res = await Promise.all(list.map((p, i) =>
      sb.from('pages').update({ start_time: vals[i], track: tr.length ? trs[i] : null, track_nums: lists[i].length ? lists[i] : null, track_times: lists[i].length ? atimes[i] : null }).eq('chapter_id', ch.id).eq('position', p.position).select()));
    const err = res.find(r => r.error);
    if (err) msg.textContent = 'Save failed: ' + err.error.message + (/track_times/.test(err.error.message) ? ' Run once in Supabase SQL editor: alter table pages add column if not exists track_times jsonb;' : '');
    else if (res.some(r => !r.data || !r.data.length)) msg.textContent = 'Nothing was saved. Check that the start_time, track and track_nums columns and the admin update policy exist (see setup SQL).';
    else msg.textContent = 'Saved.';
  } });
  const close = h('button', { type: 'button', className: 'link', textContent: 'Close', onclick: () => { au.pause(); box.classList.add('hidden'); box.replaceChildren(); } });

  /* add page images to this chapter */
  const imgIn = h('input', { type: 'file', accept: 'image/*', multiple: true, className: 'hidden' });
  const addImgs = h('button', { type: 'button', className: 'link', textContent: '+ Add page images', onclick: () => imgIn.click() });
  imgIn.onchange = async () => {
    const files = [...imgIn.files].filter(x => x.type.startsWith('image/')).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    imgIn.value = '';
    if (!files.length) return;
    try {
      const d = capture();
      const folder = list.length && list[0].image_path ? list[0].image_path.split('/')[0] : (tr.length ? tr[0].audio_path.split('/')[0] : 'node-' + ch.id);
      let n = list.length ? Math.max(...list.map(x => x.position)) : 0; const rows = [];
      for (const f of files) {
        msg.textContent = `Uploading image ${rows.length + 1} of ${files.length}...`;
        const { blob, name } = await shrink(f); n++;
        const p = `${folder}/p${String(n).padStart(3, '0')}-${Date.now()}-${name}`;
        const r = await sb.storage.from(B).upload(p, blob, { contentType: blob.type }); if (r.error) throw r.error;
        rows.push({ chapter_id: ch.id, position: n, image_path: p });
      }
      const r = await sb.from('pages').insert(rows); if (r.error) throw r.error;
      await loadChapters(); loadStats();
      openTiming(chapters.find(c => c.id === ch.id) || ch, { draft: d, note: `Added ${rows.length} page(s) at the end.` });
    } catch (err) { msg.textContent = 'Upload failed: ' + err.message; }
  };

  /* undo the most recent upload */
  const last = tr[tr.length - 1];
  const removeLast = last ? h('button', { type: 'button', className: 'link', textContent: 'Remove last track', onclick: async () => {
    if (!confirm(`Remove track ${tr.length} and its audio file? It will also be taken off any page that uses it.`)) return;
    const r = last.id ? await sb.from('tracks').delete().eq('id', last.id) : await sb.from('chapters').update({ audio_path: null }).eq('id', ch.id);
    if (r.error) return msg.textContent = 'Could not remove: ' + r.error.message;
    await sb.storage.from(B).remove([last.audio_path]);
    await sb.from('pages').update({ track: null, start_time: null }).eq('chapter_id', ch.id).eq('track', tr.length);
    const { data: pp } = await sb.from('pages').select('position,track_nums').eq('chapter_id', ch.id);
    for (const x of (pp || [])) {
      if (Array.isArray(x.track_nums) && x.track_nums.includes(tr.length)) {
        const nl = x.track_nums.filter(n => n !== tr.length);
        await sb.from('pages').update({ track_nums: nl.length ? nl : null }).eq('chapter_id', ch.id).eq('position', x.position);
      }
    }
    await loadChapters(); loadStats();
    openTiming(chapters.find(c => c.id === ch.id) || ch);
  } }) : '';

  box.replaceChildren(
    h('h3', { textContent: 'Pages & audio: ' + ch.title }),
    h('p', { className: 'note', textContent: 'Under each page, build its audio: pick a track you already uploaded, or upload a new one. Tracks on a page play one after the other, then the next page begins. Alternatively, leave the page audio empty and use the times: play one long track and click "Use current time" when each page should appear.' }),
    h('div', { className: 'note' }, ...(tr.length ? tr.map((x, i) => h('div', { textContent: `Track ${i + 1}: ${x.audio_path.split('/').pop().replace(/^audio-(\d+-)*/, '')}` })) : [h('div', { textContent: 'No audio uploaded yet.' })])),
    h('div', { className: 'prev' }, au, pvLab),
    modeNote,
    ...(list.length ? inputs.map(x => x.row) : [h('p', { className: 'note', textContent: 'This chapter has no pages yet. Use "+ Add page images" below.' })]),
    h('div', { style: 'display:flex;gap:24px;align-items:center;flex-wrap:wrap' }, addImgs, imgIn, save, close, removeLast),
    msg
  );
}

/* ---------- admin: chapters ---------- */
function renderRows() {
  const box = $('rows');
  if (!chapters.length) return box.replaceChildren(h('p', { className: 'empty', textContent: 'No entries yet.' }));
  box.replaceChildren(...flat().map(({ c: ch, d }) => {
    const pos = h('input', { type: 'text', value: ch.position, inputMode: 'numeric', ariaLabel: 'Position' });
    const ti = h('input', { type: 'text', value: ch.title, ariaLabel: 'English title', placeholder: 'English title' });
    const tg = h('input', { type: 'text', value: ch.title_gu || '', ariaLabel: 'Gujarati title', placeholder: 'Gujarati title' });
    const bad = new Set([ch.id, ...desc(ch).map(x => x.id)]), ht = heightOf(ch);
    const par = h('select', { ariaLabel: 'Parent' }, h('option', { value: '', textContent: 'Top level' }),
      ...flat().filter(x => !bad.has(x.c.id) && x.d + ht <= 3).map(x => h('option', { value: x.c.id, textContent: pad(x.d) + x.c.title })));
    par.value = ch.parent_id || '';
    const save = h('button', { className: 'link', textContent: 'Save', onclick: async () => {
      const r = await sb.from('chapters').update({ title: ti.value, title_gu: tg.value || null, position: +pos.value, parent_id: +par.value || null }).eq('id', ch.id);
      if (r.error) alert(r.error.message); loadChapters();
    } });
    const tim = h('button', { className: 'link', textContent: 'Pages & audio', onclick: () => openTiming(ch) });
    const add = d < 3 ? h('button', { className: 'link', textContent: '+ Sub', onclick: () => {
      tab('up'); $('target').value = ''; syncTarget(); $('parent').value = ch.id; $('cTitle').focus();
    } }) : h('span');
    const del = h('button', { className: 'link', textContent: 'Delete', onclick: async () => {
      const all = [ch, ...desc(ch)], n = all.length - 1, ids = all.map(x => x.id);
      if (!confirm(`Delete "${ch.title}"${n ? ` and its ${n} sub-section(s)` : ''}, with all audio and pages?`)) return;
      const { data: pg } = await sb.from('pages').select('image_path').in('chapter_id', ids);
      const { data: tk } = await sb.from('tracks').select('audio_path').in('chapter_id', ids);
      const files = [...new Set([...all.map(x => x.audio_path).filter(Boolean), ...(tk || []).map(x => x.audio_path), ...(pg || []).map(p => p.image_path)])];
      if (files.length) await sb.storage.from(B).remove(files);
      await sb.from('tracks').delete().in('chapter_id', ids);
      await sb.from('chapters').delete().eq('id', ch.id); await loadChapters(); loadStats();
    } });
    const row = h('div', { className: 'row' }, pos, ti, tg, par, save, tim, add, del);
    row.style.marginLeft = (d - 1) * 22 + 'px'; return row;
  }));
}

/* ---------- admin: members ---------- */
async function loadMembers() {
  const { data } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  $('mrows').replaceChildren(...(data || []).map(u => {
    const self = u.id === me.id;
    const acc = h('button', { className: 'link', textContent: u.approved ? 'Active (pause)' : 'Paused (allow)', disabled: self,
      onclick: async () => { await sb.from('profiles').update({ approved: !u.approved }).eq('id', u.id); loadMembers(); } });
    const rol = h('button', { className: 'link', textContent: u.is_admin ? 'Admin (remove)' : 'Member (make admin)', disabled: self,
      onclick: async () => { await sb.from('profiles').update({ is_admin: !u.is_admin }).eq('id', u.id); loadMembers(); } });
    return h('tr', {}, h('td', { textContent: u.full_name || '-' }), h('td', { textContent: u.email }),
      h('td', { textContent: fmt(u.created_at) }), h('td', { textContent: fmt(u.last_seen) }), h('td', {}, acc), h('td', {}, rol));
  }));
}
</script>
